<div
    class="payment-method two-payment-method"
    data-bind="css: {'_active': (getCode() == isChecked())}, visible: isTwoVisible"
>
    <div class="payment-method-title field choice">
        <div class="payment-option-title-container">
            <input
                type="radio"
                name="payment[method]"
                class="radio"
                data-bind="attr: {'id': getCode()}, value: getCode(),
                checked: isChecked, click: selectPaymentMethod,
                visible: isRadioButtonVisible()"
            />
            <div class="two-title-block">
                <span class="two-payment-title" data-bind="text: getTitle()"></span>
                <div class="two-payment-subtitle" data-bind="html: twoSubtitleHtml"></div>
                <a
                    class="two-about-link"
                    target="_blank"
                    rel="noopener"
                    data-bind="visible: showWhatIsTwo, attr: {href: aboutLinkUrl}, text: aboutLinkText"
                ></a>
            </div>
            <div class="two-payment-shield"></div>
        </div>
    </div>

    <div class="payment-method-content">
        <!-- ko if: showTermSelector -->
        <div class="field two-term-chips">
            <label class="label">
                <span data-bind="i18n: 'Selected payment terms'"></span>
            </label>
            <div class="two-term-chips__container">
                <!-- ko foreach: termOptions -->
                <button
                    type="button"
                    class="two-term-chip"
                    data-bind="click: function() { $parent.selectTerm(days) },
                                   css: { 'two-term-chip--selected': days === $parent.selectedTerm() }"
                >
                    <span class="two-term-chip__days" data-bind="text: daysLabel"></span>
                    <!-- ko if: isLoading -->
                    <span class="two-term-chip__loading" aria-hidden="true"
                        ><span>.</span><span>.</span><span>.</span></span
                    >
                    <!-- /ko -->
                    <!-- ko if: !isLoading && surchargeLabel -->
                    <span class="two-term-chip__surcharge" data-bind="text: surchargeLabel"></span>
                    <!-- /ko -->
                </button>
                <!-- /ko -->
            </div>
        </div>
        <!-- /ko -->
        <!-- ko if: showSingleTerm -->
        <div class="field two-term-chips">
            <div class="two-term-chips__container">
                <span class="two-term-chip two-term-chip--single">
                    <span class="two-term-chip__days" data-bind="text: singleTermLabel"></span>
                    <!-- ko if: singleTermSurchargeLabel() === null -->
                    <span class="two-term-chip__loading" aria-hidden="true"
                        ><span>.</span><span>.</span><span>.</span></span
                    >
                    <!-- /ko -->
                    <!-- ko if: singleTermSurchargeLabel() -->
                    <span
                        class="two-term-chip__surcharge"
                        data-bind="text: singleTermSurchargeLabel"
                    ></span>
                    <!-- /ko -->
                </span>
            </div>
        </div>
        <!-- /ko -->
        <!--
            TWO-25326 §7.3 (2026-08-03 ruling): the standalone
            `.two-company-label` text that used to sit here is REMOVED, not
            supplemented. The captured company NAME is now shown ONLY
            inside the order-intent notice sentence itself — see
            ConfigProvider::getOrderIntentApprovedNotice() /
            getOrderIntentDeclinedNotice() for the copy templates and
            resolveCompanyNotice() in gateway_method.js for the substitution.
            A company captured with no intent outcome yet showing renders
            neither notice below and therefore displays the company NAME
            nowhere in the tile — that follows from "the notice is the
            only display surface for the name" and is the ruling, not an
            oversight. The company NUMBER is a separate surface (2026-08-04
            ruling, §5/§7 follow-up): see the `.two-company-id-text` label
            further down this template, which renders independently of
            these notices.

            Persistent inline notices, inside the payment tile next to the
            term chips. Each is emitted only when its own observable is
            non-empty, so a brand that suppresses the intent message
            entirely (<intent_approved_notice_enabled>false</…> in
            brand.xml) yields no element at all rather than an empty
            wrapper — both notices share that one suppression switch, see
            ConfigProvider. Class names match the PrestaShop / WooCommerce
            surfaces so the four platforms stay greppable; `declined` is a
            new modifier alongside the existing `approved` one.
        -->
        <!--
            Order-intent spinner, TILE-LOCAL by requirement (TWO-25326): a
            spinner shown while an order-intent check is in flight must be
            scoped inside the payment tile and must never be a page-covering
            overlay. This replaces the `fullScreenLoader` that check used to
            raise — see orderIntentInProgress in gateway_method.js for why the
            observable behind it is module-scope and shared, and style.css for
            the figure (the same 16x16 asset the company-search field spinner
            uses).

            `ko if:`, not `visible:`, and that is an accessibility choice
            rather than a stylistic one: a `role="status"` region that is
            merely un-hidden announces nothing on most screen readers, while one
            INSERTED into the document does. There is no race to lose by it —
            bindings are applied before any order-intent request can start.

            TWO-25326 (2026-08-05, four-platform convergence): the spinner is
            no longer text-less. All four plugins now show the SAME spokes
            figure next to the SAME sentence, "Checking availability" — Luma
            and WooCommerce previously showed a wordless figure and PrestaShop
            and Hyva showed two different sentences. The visible text is what
            names the region, so the figure carries `aria-hidden` and there is
            no `aria-label` any more: a labelled `role="status"` wrapping
            visible text is announced twice.
        -->
        <!-- ko if: orderIntentInProgress() -->
        <div class="two-order-intent-loading" role="status">
            <span class="two-order-intent-spinner" aria-hidden="true"></span>
            <span
                class="two-order-intent-loading__text"
                data-bind="i18n: 'Checking availability'"
            ></span>
        </div>
        <!-- /ko -->
        <!-- ko if: isOrderIntentApprovedNoticeVisible() -->
        <div
            class="two-order-intent-message approved"
            role="status"
            data-bind="text: orderIntentApprovedNotice"
        ></div>
        <!-- /ko -->
        <!-- ko if: isOrderIntentDeclinedNoticeVisible() -->
        <div
            class="two-order-intent-message declined"
            role="status"
            data-bind="text: orderIntentDeclinedNotice"
        ></div>
        <!-- /ko -->
        <!--
            TWO-25326 (2026-08-05, four-platform convergence): the THIRD
            outcome of an order-intent check — it errored — now renders in the
            same bordered box as approval and decline, instead of only as a
            checkout toast that the next checkout update wipes. PrestaShop is
            the reference: it shows all three outcomes in one container and
            drops the approved/declined colour for the error case, so this
            modifier is deliberately the box's neutral palette rather than
            Magento's `.message-error`.

            Not gated on the brand's intent-message suppression switch, unlike
            the two above: an error is not the intent verdict a brand can
            choose not to state, it is the buyer's only sign that the check did
            not happen.
        -->
        <!-- ko if: isOrderIntentErrorNoticeVisible() -->
        <div
            class="two-order-intent-message error"
            role="alert"
            data-bind="text: orderIntentErrorNotice"
        ></div>
        <!-- /ko -->
        <!--
            TWO-25503: ONE control offering the three company-capture options
            as peers, matching WooCommerce and PrestaShop. It replaces a
            two-item tab bar (registered / sole trader) plus a separately
            worded "My company is not on the list" button inside the search
            dropdown, which made manual entry reachable only by opening the
            picker and rejecting its results.

            Deviation from WC/PS, forced rather than chosen: both siblings
            build the chip group INSIDE the open picker, as a sibling of the
            results list, because their picker stays alive across every mode.
            Magento's sole-trader and manual modes both tear the select2
            widget down (enterSoleTraderUi/clearCompany), so chips living in
            the dropdown would be unreachable from exactly the two modes that
            need a way back. They therefore stay in this persistent control.

            Which chips render is per-option, not per-control:
              - registered is unconditional — it is also the way OUT of the
                other two, and that has to work on a checkout whose search
                control lives in the address area;
              - sole trader follows showModeTab (the billing country's
                registry supports SOLE_TRADER);
              - manual entry follows showManualEntryChip(): it acts on the
                tile's own company-name field, so where the address area owns
                the search control instead it belongs to that mount and its
                own in-dropdown button; and with the address-area setting off
                it is not offered at all, because no address-step lookup then
                exists to supply the company number the method requires.
        -->
        <!-- ko if: showModeTab() || isTileCompanySearchActive() -->
        <div class="mode_selector" data-element="popup-message">
            <span
                class="mode_item"
                data-bind="
                    attr: { 'data-element': captureMode() === 'registered' ? 'selected-element' : 'click-element' },
                    event: { click: () => registeredOrganisationMode({ openDropdown: true }) }
                "
            >
                <!-- ko i18n: 'Registered company' --><!-- /ko -->
            </span>
            <!-- ko if: showModeTab -->
            <span
                class="mode_item"
                data-bind="
                    attr: { 'data-element': captureMode() === 'soletrader' ? 'selected-element' : 'click-element' },
                    event: { click: () => soleTraderMode() }
                "
            >
                <!-- ko i18n: 'Sole trader' --><!-- /ko -->
            </span>
            <!-- /ko -->
            <!-- ko if: showManualEntryChip() -->
            <span
                class="mode_item"
                data-bind="
                    attr: { 'data-element': captureMode() === 'manual' ? 'selected-element' : 'click-element' },
                    event: { click: () => manualEntryMode() }
                "
            >
                <!-- ko i18n: 'Enter manually' --><!-- /ko -->
            </span>
            <!-- /ko -->
        </div>
        <!-- /ko -->

        <!-- ko if: showPopupMessage -->
        <div class="sole_trader_note" data-element="sole-trader">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
            >
                <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0M3.124 7.5A8.969 8.969 0 015.292 3m13.416 0a8.969 8.969 0 012.168 4.5"
                />
            </svg>
            <div class="popup_message" data-element="popup-message">
                <span data-element="click-element" data-bind="event: { click: () => openIframe() }">
                    <!-- ko i18n: 'Click here to log in or sign up as a Sole Trader.' --><!-- /ko -->
                </span>
            </div>
        </div>
        <!-- /ko -->

        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <form
            id="two_gateway_form"
            data-bind="attr: {'data-hasrequired': $t('* Required Fields')}"
            onkeydown="return event.key != 'Enter';"
        >
            <fieldset
                class="fieldset payment method"
                data-bind='attr: {id: "payment_form_" + getCode()}'
            >
                <!--
                    TWO-25326, 2026-08-04 ruling (supersedes the §7/§7.1
                    capture-state and decline-recovery gating that used to
                    live in this comment — Doug's exact words: "the search
                    control ... is controlled ONLY by the state of the
                    'enable search in address' admin setting: if true,
                    search control is rendered inside the address block,
                    otherwise is rendered inside the payment tile — and
                    search control visibility is not changed for any other
                    reason").

                    So this field's visibility depends on ONE thing —
                    isTileCompanySearchActive(), the live read of that single
                    admin setting (plus the saved-address/virtual-cart
                    fallback documented on that method in gateway_method.js,
                    which is the SAME condition, not a second one). It no
                    longer depends on isCompanyCaptured() or on any
                    order-intent outcome: the control stays visible after a
                    company is picked, whether the subsequent order-intent
                    call approves, declines, or errors. The org-number label
                    below (not the notice sentence) is now the one thing that
                    changes on capture.

                    The previous behaviour hid this field once
                    isCompanyCaptured() went true, on the theory that the
                    order-intent notice sentence made an editable, visible
                    control redundant — and only re-showed it on a decline,
                    via isCompanyRecoveryNeeded(), to avoid a dead end for a
                    buyer with no other route to pick a different company.
                    Doug found this INCORRECT in live testing on 2026-08-04:
                    the control was disappearing when a company was picked
                    and, on the common path (order intent approves), never
                    coming back — with nothing marking that as intentional
                    from the buyer's side. This ruling removes that coupling
                    entirely rather than patching it again.

                    `visible:`, not `if:`, for the same reason as before:
                    it keeps the node in the DOM so the select2 binding, its
                    MutationObserver rebinding and the sole-trader write path
                    all keep working untouched; `if:` would destroy and
                    rebuild the node under them.

                    Hiding (when isTileCompanySearchActive() is false) also
                    takes this `required` input out of jQuery Validation's
                    way — `elements()` skips hidden fields, and that state is
                    exactly the one where the buyer has the address-area
                    control instead.
                -->
                <div
                    class="field field-text required"
                    data-bind="visible: isTileCompanySearchActive()"
                >
                    <label for="company_name" class="label">
                        <span><!-- ko i18n: 'Company Name'--><!-- /ko --></span>
                    </label>
                    <div class="control two-sole-trader-field-control">
                        <!--
                            `readonly` is BOUND, not static, and the binding is
                            what keeps this field satisfiable. In sole-trader
                            mode this input is a plain text box holding a name
                            the autofill response captured, and the buyer must
                            not be able to edit or clear it. In the other two
                            modes it must stay writable: company search replaces
                            this node with its own select2 chrome (so the buyer
                            never types here anyway), and manual entry tears the
                            widget down precisely so the buyer CAN type a name
                            by hand. A static `readonly` here would brick manual
                            entry outright.

                            isCompanyNameReadOnly() is deliberately narrower
                            than sole-trader mode — see its docblock in
                            gateway_method.js. This input is `required`, and
                            jQuery Validation enforces that on a `[readonly]`
                            field (it skips only `:disabled`), so any state
                            where the field can be both empty and locked is a
                            validation error the buyer has no way to clear.
                            See TWO-25288.

                            `required` is likewise BOUND, not static, to
                            `isTileCompanySearchActive()` — the same condition
                            the wrapper's `visible:` binding above uses. `visible`
                            only sets `display:none` on the wrapper; it does not
                            touch this input's `required` attribute, and native
                            HTML5 constraint validation still blocks form
                            submission on a required field that is not rendered,
                            silently (no bubble, since there's nowhere to point
                            it). jQuery Validation's own `elements()` already
                            skips hidden fields, so this only closes the native
                            validation gap, but native validation runs first and
                            was the one actually blocking Place Order. TWO-25503.
                        -->
                        <input
                            type="text"
                            id="company_name"
                            name="payment[company_name]"
                            data-bind='
                            attr: {
                                title: $t("Company Name"),
                                readonly: isCompanyNameReadOnly(),
                                required: isTileCompanySearchActive()
                            },
                            value: companyName'
                            class="input-text"
                        />
                        <!--
                            In-flight spinner for lookupSoleTrader()'s token-mint
                            + buyer-lookup round trip (TWO-25461 §7). Lives inside
                            this field's own `.control` (see
                            `.two-sole-trader-field-control` in style.css for the
                            `position: relative` that anchors it), not a separate
                            overlay — same shape as the address step's
                            `.two-company-search__spinner`. `visible:`, not `ko if:`,
                            because this toggles rapidly on every email edit and the
                            field is not a `role="status"` region.
                        -->
                        <span
                            class="two-sole-trader-prefetch-spinner"
                            aria-hidden="true"
                            data-bind="visible: soleTraderLookupInFlight"
                        ></span>
                        <!--
                            The captured organisation number, as plain text
                            underneath the field — TWO-25326, 2026-08-04
                            ruling. This is NOT a reinstatement of the
                            `.two-company-label` line §7 added and the
                            2026-08-03 ruling (§7.3) removed: that was a
                            single line combining name AND number, gated on
                            the order-intent notice's own visibility, and it
                            stays removed. This is the tile's equivalent of
                            the address-step's own `.two-company-id-text`
                            label (see renderCompanyIdText() in
                            address-autocomplete.js and TWO-25326 §5) —
                            NUMBER only, gated on capture rather than on any
                            notice, so the two mount points behave the same
                            way once a result is picked, independent of
                            whether order intent is even enabled.

                            Reuses `.two-company-id-text`'s styling (see
                            style.css) for the same reason the address step
                            has it: right/end-aligned under the field it
                            annotates. Absent before a result is selected and
                            absent again in manual-entry mode, because
                            isCompanyCaptured() requires a name AND a number
                            and manual entry clears the number
                            (clearCompany()) — matching
                            renderCompanyIdText()'s own "not visible before
                            selection, never in manual entry" rule.

                            The value itself is untouched either way —
                            `companyId` is still the single carrier and
                            getData() still reads it, never the DOM.

                            Bound to displayCompanyId(), not to `companyId`
                            directly: an internal `TWO:`-prefixed identifier is
                            never shown to the buyer (TWO-25326), and the
                            formatter's empty return is what takes the whole
                            label out rather than leaving a blank one. Same
                            helper the dropdown row, the address-step label and
                            the order-intent notice go through.
                        -->
                        <div
                            class="two-company-id-text"
                            data-bind="visible: isCompanyCaptured() && isTileCompanySearchActive() && displayCompanyId() !== '', text: displayCompanyId(), attr: {'aria-label': $t('Company Number')}"
                        ></div>
                    </div>
                </div>
                <!--
                    "Select a different sole trader" (TWO-25461 §7, porting
                    guide §0/§7). A SIBLING AFTER the company field's outer
                    wrapper, never a descendant of it — only renders once a
                    sole-trader identity has been adopted (name + number
                    captured), the same one-way affordance PS/WC ship. There
                    is deliberately no equivalent for an adopted registered
                    company; that case reuses clicking the field itself to
                    reopen search.
                -->
                <div
                    class="two-select-different-sole-trader"
                    data-bind="visible: showSoleTrader() && isCompanyCaptured()"
                >
                    <button
                        type="button"
                        class="two-select-different-sole-trader__link"
                        data-bind="event: { click: () => selectDifferentSoleTrader() }"
                    >
                        <!-- ko i18n: 'Select a different sole trader' --><!-- /ko -->
                    </button>
                </div>
                <!--
                    Optional buyer fields. ORDER IS LOAD-BEARING: this markup
                    order is what the buyer sees, and it must match the admin
                    pane sequence declared in etc/adminhtml/system.xml and
                    etc/adminhtml/brand_form_template.xml (the latter's
                    sortOrder is the one that actually orders the pane — see
                    the note in that file): invoice email, purchase order
                    number, project, department, and the order note LAST.
                    TWO-25263.
                -->
                <div class="field field-text" data-bind="visible: isInvoiceEmailsEnabled">
                    <label for="invoice_emails" class="label">
                        <span data-bind="i18n: 'Invoice email address'"></span>
                    </label>
                    <div class="control">
                        <input
                            type="text"
                            id="invoice_emails"
                            data-bind="value: invoiceEmails, event: { change: validateEmails },
                            attr: {title: displayTooltips ? $t('Invoice email address') : ''}"
                            class="input-text"
                        />
                    </div>
                </div>
                <div class="field field-text" data-bind="visible: isPONumberFieldEnabled">
                    <label for="two_po_number" class="label">
                        <span><!-- ko i18n: 'PO Number'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <input
                            type="text"
                            id="two_po_number"
                            name="payment[poNumber]"
                            data-bind='
                            attr: {title: displayTooltips ? $t("PO Number") : ""},
                            value: poNumber'
                            class="input-text"
                        />
                    </div>
                </div>
                <div class="field field-text" data-bind="visible: isProjectFieldEnabled">
                    <label for="two_project" class="label">
                        <span> <!-- ko i18n: 'Project'--><!-- /ko --> </span>
                    </label>
                    <div class="control">
                        <input
                            type="text"
                            id="two_project"
                            name="payment[project]"
                            data-bind='
                            attr: {title: displayTooltips ? $t("Project") : ""},
                            value: project'
                            class="input-text"
                        />
                    </div>
                </div>
                <div class="field field-text" data-bind="visible: isDepartmentFieldEnabled">
                    <label for="two_department" class="label">
                        <span><!-- ko i18n: 'Department'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <input
                            type="text"
                            id="two_department"
                            name="payment[department]"
                            data-bind='
                            attr: {title: displayTooltips ? $t("Department") : ""},
                            value: department'
                            class="input-text"
                        />
                    </div>
                </div>
                <div class="field field-text" data-bind="visible: isOrderNoteFieldEnabled">
                    <label for="two_order_note" class="label">
                        <span><!-- ko i18n: 'Order Note'--><!-- /ko --></span>
                    </label>
                    <div class="control">
                        <input
                            type="text"
                            id="two_order_note"
                            name="payment[orderNote]"
                            data-bind='
                            attr: {title: displayTooltips ? $t("Order Note") : ""},
                            value: orderNote'
                            class="input-text"
                        />
                    </div>
                </div>
                <!-- ko if: isPaymentTermsEnabled -->
                <div class="payment-method-content terms-container">
                    <input
                        type="checkbox"
                        name="terms-checkbox"
                        data-bind="checked: isPaymentTermsAccepted, event: { change: logIsPaymentsAccepted }"
                    />
                    <span class="terms-text" data-bind="html: paymentTermsMessage"></span>
                </div>
                <!-- /ko -->
            </fieldset>
        </form>
        <div class="actions-toolbar">
            <div class="primary">
                <button
                    data-role="review-save"
                    type="submit"
                    data-bind="
                        attr: {title: $t('Place Order')},
                        enable: (getCode() == isChecked()),
                        click: placeOrder,
                        css: {disabled: !isPlaceOrderActionAllowed()}
                        "
                    class="action primary checkout"
                >
                    <span data-bind="i18n: 'Place Order'"></span>
                </button>
            </div>
        </div>
    </div>
</div>
