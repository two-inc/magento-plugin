name: Release

# Triggered after CI completes on `main`. Release only fires when CI's
# conclusion is 'success' (gated below), so a broken commit landing on
# `main` cannot produce a tagged Release page.
#
# This workflow NO LONGER COMPUTES A VERSION. The version is decided on
# the pull request that lands on `staging`
# (.github/workflows/version-bump.yml + .github/scripts/decide-bump-level.sh),
# from the conventional-commit types of that PR's own commits, so it
# describes the change rather than the branch it merged into. By the time
# a change reaches `main` the tree already declares the version it ships
# as, and `main`'s only job is to tag that version and cut the Release.
#
# Two consequences worth stating, because both were previously the other
# way round:
#
#   staging — nothing happens here at all. `staging` used to get a patch
#             bump on every green commit; it now arrives carrying the
#             version its PR computed.
#   main    — tag + GitHub Release for the version already in the tree.
#             No bump commit, so nothing is pushed to `main`.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

# Per-branch concurrency group: a `main` release and a `staging` bump
# are independent pieces of work and must not serialise behind each
# other.
concurrency:
  group: release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ${{ vars.RUNNER_STANDARD }}
    # CI must have succeeded on the same SHA. workflow_run fires on
    # every CI completion (success/failure/cancelled); this filters to
    # the green case. There is no longer a bump-commit guard here:
    # nothing pushes a commit to `main` any more, and a guard on the
    # commit subject would suppress a legitimate release whose tip
    # happens to be the version commit that came in from `staging`.
    if: |
      github.event.workflow_run.conclusion == 'success'
    env:
      # The branch CI ran for. Always `main` now (see the trigger
      # above); kept because the log lines and skip warnings read it.
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.TWO_INC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TWO_INC_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          # Check out the branch (not the SHA) so HEAD lands on
          # `main` / `staging` rather than detached — bumpver's commit
          # then advances the branch, and the later `git push origin
          # "$BRANCH"` actually pushes the bump.
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Should we release?
        # Two reasons to skip:
        # 1. Branch drift — workflow_run fires after CI completes,
        #    but another commit could land in the small window before
        #    this job runs. If branch HEAD no longer matches the SHA
        #    CI signed off on, the next CI cycle will retry against
        #    the new tip.
        # 2. Already tagged — re-runs on the same commit (or on the
        #    bumpver commit itself) shouldn't produce a duplicate
        #    release. Match bare numeric tags (1.14.1 etc.) — the
        #    repo's established convention. This is also what makes
        #    the merge-back safe: when a `main` release fast-forwards
        #    into `staging`, staging's new tip already carries that
        #    release's tag, so this correctly bumps nothing.
        id: gate
        env:
          PASSED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          if [ "$actual" != "$PASSED_SHA" ]; then
            echo "::warning::${BRANCH} moved from ${PASSED_SHA} to ${actual} between CI and release. Skipping."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          existing=$(git tag --points-at HEAD | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          if [ -n "$existing" ]; then
            echo "HEAD already tagged as $existing — nothing to release."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        if: steps.gate.outputs.skip == '0'
        run: |
          git config user.name "two-inc-app[bot]"
          git config user.email "${{ vars.TWO_INC_APP_ID }}+two-inc-app[bot]@users.noreply.github.com"

      - name: Build release notes
        # Single pass over `<previous-numeric-tag>..HEAD`,
        # bucketing each non-merge commit into Breaking / Features /
        # Fixes / Internals / Other by conventional-commit type, with
        # optional Linear ticket prefix (e.g. CET-123/feat:). This is
        # presentation only — the version is already decided and committed
        # by the time a change reaches `main`.
        if: steps.gate.outputs.skip == '0' && env.BRANCH == 'main'
        id: notes
        run: |
          set -euo pipefail
          prev=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -n "$prev" ]; then
            range="${prev}..HEAD"
          else
            range="HEAD"
          fi

          : > release-notes.md
          : > /tmp/breaking
          : > /tmp/features
          : > /tmp/fixes
          : > /tmp/internals
          : > /tmp/other

          while IFS=$'\t' read -r sha subject; do
            line="- ${subject} (${sha})"
            if echo "$subject" | grep -qE '^([A-Z]+-[0-9]+/)?[a-z]+(\([^)]+\))?!:|^BREAKING CHANGE:'; then
              echo "$line" >> /tmp/breaking
            elif echo "$subject" | grep -qE '^([A-Z]+-[0-9]+/)?feat(\([^)]+\))?:'; then
              echo "$line" >> /tmp/features
            elif echo "$subject" | grep -qE '^([A-Z]+-[0-9]+/)?fix(\([^)]+\))?:'; then
              echo "$line" >> /tmp/fixes
            elif echo "$subject" | grep -qE '^([A-Z]+-[0-9]+/)?(chore|refactor|ci|docs|test|build|perf|style)(\([^)]+\))?:'; then
              echo "$line" >> /tmp/internals
            else
              echo "$line" >> /tmp/other
            fi
          done < <(git log "$range" --no-merges --format='%h%x09%s')

          # Render notes — only print sections that have entries.
          {
            [ -s /tmp/breaking ]  && { echo "## ⚠️ Breaking changes";  cat /tmp/breaking;  echo; }
            [ -s /tmp/features ]  && { echo "## 🚀 Features";          cat /tmp/features;  echo; }
            [ -s /tmp/fixes ]     && { echo "## 🐛 Fixes";              cat /tmp/fixes;     echo; }
            [ -s /tmp/internals ] && { echo "## 🧰 Internals";          cat /tmp/internals; echo; }
            [ -s /tmp/other ]     && { echo "## Other";                 cat /tmp/other;     echo; }
          } > release-notes.md
          # Stash the previous tag so the post-bump step can append a
          # "Full diff" link with the proper <prev>..<new> range —
          # the new tag isn't known yet at this point.
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

          echo "--- release-notes.md preview ---"
          cat release-notes.md

      - name: Read the version to release
        # The version is NOT computed here any more. It was computed and
        # committed on the pull request that landed on `staging`
        # (.github/workflows/version-bump.yml + decide-bump-level.sh), so by the
        # time a change reaches `main` the tree already declares the version it
        # ships as. `main` only tags what is there and cuts the Release.
        if: steps.gate.outputs.skip == '0'
        id: ver
        run: |
          set -euo pipefail
          new=$(sed -n 's/^[[:space:]]*current_version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' bumpver.toml | head -1)
          [ -n "$new" ] || { echo "::error::could not read current_version from bumpver.toml"; exit 1; }
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "Releasing version $new (already declared in the tree)"

      - name: Append full-diff link to release notes
        # Now that the new version is known we can render a proper
        # <prev>..<new> link instead of leaving the right-hand side
        # blank (the prior shape rendered as "<prefix>-1.13.2..").
        # `main` only — the notes only exist there.
        if: steps.gate.outputs.skip == '0' && env.BRANCH == 'main'
        env:
          PREV: ${{ steps.notes.outputs.prev }}
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          if [ -n "$PREV" ]; then
            echo "**Full diff:** [\`${PREV}..${NEW}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREV}...${NEW})" >> release-notes.md
          fi

      - name: Tag + push tag
        # `main` only. `staging` gets a version-bump commit and nothing
        # else — no tag, therefore no GitHub Release either.
        if: steps.gate.outputs.skip == '0' && env.BRANCH == 'main'
        env:
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          set -euo pipefail
          git tag -a "${NEW}" -m "Release v${NEW}"
          git push origin "${NEW}"

      - name: Create GitHub Release
        # `main` only, for the same reason as the tag above.
        if: steps.gate.outputs.skip == '0' && env.BRANCH == 'main'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          # Publishing the artifact is out of scope here — this just
          # cuts the tag and Release page. --notes-file points at the
          # bucketed changelog rendered in the release-notes step.
          gh release create "${NEW}" \
            --target main \
            --title "${NEW}" \
            --notes-file release-notes.md
